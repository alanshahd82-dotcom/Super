<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b5e3a" />
  <meta name="description" content="مؤشر الأسواق — قارن أسعار الخضروات في الأسواق المغربية." />
  <title>مؤشر الأسواق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" aria-label="تطبيق مؤشر الأسواق">
    <div class="phone-shell">
      <span class="side-button side-button--top" aria-hidden="true"></span>
      <span class="side-button side-button--middle" aria-hidden="true"></span>
      <span class="side-button side-button--bottom" aria-hidden="true"></span>
      <div class="phone-screen">
        <div class="status-bar" aria-hidden="true">
          <span class="status-time">09:41</span>
          <div class="dynamic-island"></div>
          <div class="status-icons">
            <span class="signal-icon"><i></i><i></i><i></i><i></i></span>
            <span class="wifi-icon"></span>
            <span class="battery-icon"><i></i></span>
          </div>
        </div>
        <div class="app-viewport" id="appViewport">
          <header class="app-header" id="appHeader"></header>
          <section class="screen-container" id="screenContainer" aria-live="polite"></section>
          <nav class="bottom-nav" id="bottomNav" aria-label="التنقل الرئيسي"></nav>
        </div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
